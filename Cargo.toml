[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-owner-recovery-provider"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
description = "Owner-local mnemonic recovery proof provider for Crowsi"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/crowsi-net/crowsi-owner-recovery-provider"
publish = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
crowsi-credential-authority-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.17"
hex = "=0.4.3"
ihat-identity-assertion-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
pbkdf2 = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"
